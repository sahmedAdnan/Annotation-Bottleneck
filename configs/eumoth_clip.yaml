# -------------------------------------------------------
# Config: EU-Moth Dataset  —  CLIP ViT-L/14 (OpenAI)
# General-purpose vision-language model trained on web
# images. Not biology-specific. Useful as a reference
# baseline to measure the benefit of domain adaptation
# in BioCLIP/BioCLIP-2.
#
# IMPORTANT: requires arch + pretrained (not hf-hub).
# The extractor reads model.arch to call:
#   open_clip.create_model_and_transforms('ViT-L-14', pretrained='openai')
# -------------------------------------------------------

dataset:
  name: eumoth
  format: imagefolder
  root: D:\Thesis\Test 1st\eu-moths-dataset-main\eu-moths-dataset-main\images
  image_extensions: [jpg, jpeg, png]
  num_classes: 200

model:
  name: clip
  arch: ViT-L-14          # model architecture for open_clip
  pretrained: openai      # OpenAI pretrained weights
  normalize_embeddings: true
  batch_size: 64
  num_workers: 8

  # CLIP was trained on generic web captions, not taxonomic text.
  # Simpler natural-language templates align better with its training
  # distribution. Taxonomic terms like "Lepidoptera" are out-of-distribution
  # for CLIP and can hurt embedding quality.
  prompt_templates:
    - "{name}"
    - "a photo of {name}"
    - "a photo of a {name} moth"
    - "a photograph of {name}"
    - "an image of {name}"

clustering:
  methods:
    - name: kmeans
      n_clusters: 200
      n_init: 50
      random_state: 42
      max_iter: 500

    - name: agglomerative
      n_clusters: 200
      linkage: ward

    - name: spectral
      n_clusters: 200
      n_init: 10
      random_state: 42
      n_neighbors: 15

    - name: gmm
      n_clusters: 200
      covariance_type: diag    # 'full' is infeasible for 512-D embeddings
      random_state: 42
      max_iter: 300

    - name: dbscan

    - name: hdbscan

evaluation:
  top_k_confusions: 20

visualization:
  method: umap
  umap:
    n_neighbors: 30
    min_dist: 0.1
    metric: cosine
    random_state: 42
  subsample: 5000
  dpi: 300
  export_pdf: true

output_dir: results/eumoth_clip
seed: 42

# -------------------------------------------------------
# Dimensionality reduction (dual-path architecture)
# -------------------------------------------------------

reduction:
  partition:
    method: pca
    n_components: 50
  density:
    method: umap
    n_components: 100
    n_neighbors: 15
    min_dist: 0.1
    metric: cosine

dbscan:
  min_samples: 5

hdbscan:
  sweep_range: [3, 5, 7, 10, 12, 15, 18, 21, 25, 30]

# -------------------------------------------------------
# Config: MothDK Subsampled (balanced, comparable to EU-Moth)
#
# Randomly selects classes
# -------------------------------------------------------

dataset:
  name: mothDK_subsample
  format: imagefolder
  root: D:\Thesis\Test 1st\MothSpeciesDK\MothSpeciesDK
  image_extensions: [jpg, jpeg, png]
  num_classes: 200

  subsample:
    enabled: true
    n_classes: 200
    images_per_class: 10       # set to -1 to keep all images (uncapped)
    min_images_per_class: 7   # exclude classes with fewer than this
    random_seed: 42

model:
  name: bioclip2
  pretrained: hf-hub:imageomics/bioclip-2.5-vith14
  normalize_embeddings: true
  batch_size: 64
  num_workers: 8

  prompt_templates:
    - "a photo of {order} {family} {genus} {name}"

clustering:
  methods:
    - name: kmeans
      n_clusters: 200
      n_init: 50
      random_state: 42
      max_iter: 500

    - name: agglomerative
      n_clusters: 200
      linkage: ward

    - name: spectral
      n_clusters: 200
      n_init: 10
      random_state: 42
      n_neighbors: 15

    - name: gmm
      n_clusters: 200
      covariance_type: diag
      random_state: 42
      max_iter: 300

    - name: dbscan

    - name: hdbscan

evaluation:
  top_k_confusions: 20

visualization:
  method: umap
  umap:
    n_neighbors: 30
    min_dist: 0.1
    metric: cosine
    random_state: 42
  tsne:
    perplexity: 40
    random_state: 42
  subsample: 5000
  dpi: 300
  export_pdf: true

output_dir: results/mothDK_subsample/MothDK_subsample_annotation
seed: 42

# -------------------------------------------------------
# Dimensionality Reduction
#
# One method is applied to ALL clustering algorithms.
# Choose based on your dataset using the analysis scripts:
#   Labeled data   -> python cli/reduction_analysis.py --config <config> --mode all
#   Unlabeled data -> python cli/reduction_analysis_unlabeled.py --config <config>
#
# Supported methods:
#   none      -- no reduction; use full 768D embeddings
#   pca       -- PCA (linear, fast)
#   umap      -- UMAP (non-linear, topology-preserving)
#   pca+umap  -- two-stage: PCA first, then UMAP (preserves both global
#                variance and local structure; set pca_components for the
#                intermediate PCA dimension)
# -------------------------------------------------------

reduction:
  method: umap           # none | pca | umap | pca+umap
  n_components: 20     # target dimension (ignored when method: none)
  n_neighbors: 15       # UMAP only: local vs. global structure balance
  min_dist: 0.1         # UMAP only: min distance in embedded space
  metric: cosine        # UMAP only: distance metric in original space
  # pca_components: 100 # pca+umap only: intermediate PCA dimension before UMAP

# -------------------------------------------------------
# DBSCAN configuration
# -------------------------------------------------------

dbscan:
  min_samples: 5

# -------------------------------------------------------
# HDBSCAN configuration
# -------------------------------------------------------

hdbscan:
  sweep_range: [2, 3, 4, 5, 7]
  cluster_selection_method: leaf 

# -------------------------------------------------------
# Annotation Pipeline
# -------------------------------------------------------

annotation:
  # Species list source: "dataset" | "file" | "gbif"
  species_source: dataset

  # Pre-computed taxonomy CSV (overrides taxonomy_source if file exists)
  taxonomy_file: mothDK_classes_with_family.csv

  # GBIF query settings (used if species_source=gbif or taxonomy lookup)
  gbif:
    taxon_key: 797            # Lepidoptera
    kingdom: Animalia
    continent: EUROPE
    country: DK
    limit: 500
    cache_dir: .cache/gbif

  # Uncertainty configuration
  uncertainty:
    review_threshold: 0.55      # combined >= 0.55 -> "review"
    human_threshold: 0.70       # combined >= 0.70 -> "human_required"
    weights:
      text_margin: 0.35
      membership_probability: 0.25
      cluster_agreement: 0.25
      taxonomic_consistency: 0.15

  # Review export settings
  include_sanity_check: true
  n_sanity: 25

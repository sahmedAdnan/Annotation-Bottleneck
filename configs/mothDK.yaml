# -------------------------------------------------------
# Config: EU-Moth Dataset
# 200 European moth species, ImageFolder format
# -------------------------------------------------------

dataset:
  name: mothDK
  format: imagefolder                        # imagefolder | cub
  root: D:\Thesis\Test 1st\MothSpeciesDK\MothSpeciesDK    # path to the folder of class subfolders
  image_extensions: [jpg, jpeg, png]
  num_classes: 351

model:
  name: bioclip2                             # bioclip2 | bioclip | clip | dinov2
  pretrained: hf-hub:imageomics/bioclip-2
  normalize_embeddings: true
  batch_size: 64
  num_workers: 8

  # Prompt templates for text-guided K-Means centroid initialization.
  #
  # WHY THESE SPECIFIC TEMPLATES:
  #   BioCLIP-2 was trained on TreeOfLife-200M, where each image is paired
  #   with structured taxonomic text, not image captions. The text encoder
  #   is therefore most aligned with taxonomic language. Prompts that include
  #   the order (Lepidoptera) and genus are closer to the model's training
  #   distribution and produce tighter image-text alignment than generic
  #   "a photo of X" prompts.
  #
  #   Using multiple templates and averaging their embeddings (ensembling)
  #   gives a more stable centroid estimate than any single prompt alone.
  #   The averaged embedding is re-normalized to the unit sphere before use.
  #
  # PLACEHOLDERS:
  #   {name}  -> full scientific name with spaces  (e.g. "abrostola tripartita")
  #   {genus} -> genus only, first word             (e.g. "abrostola")
  #
  # TUNING: if you know the family names for your species, adding a template
  # like "a moth of the family Noctuidae, {name}" improves alignment further.
  # Keep to 4-8 templates; returns diminish beyond that.
  prompt_templates:
    - "{name}"
    - "a photo of {name}"
    - "a photo of {name}, a moth found in Denmark"
    - "a moth in the order Lepidoptera, {name}"
    - "a moth in the order noctua, {name}"
    - "a macro photograph of {name}, a moth"
    - "{genus} {name}, Lepidoptera"
    - "{genus} {name}, noctua"

clustering:
  methods:
    - name: kmeans
      n_clusters: 351
      n_init: 50
      random_state: 42
      max_iter: 500

    - name: kmeans_text_guided
      n_clusters: 351
      n_init: 1
      random_state: 42
      max_iter: 300

    - name: agglomerative
      n_clusters: 351
      linkage: ward

    - name: spectral
      n_clusters: 351
      n_init: 10
      random_state: 42
      # n_neighbors controls the affinity graph. Too small a value leaves
      # some images disconnected, causing sklearn's "Graph is not fully
      # connected" warning and less reliable eigenvectors. 15 is sufficient
      # for ~2000 images with 200 classes (~11 images/class).
      n_neighbors: 15

    # DBSCAN: all detailed parameters live in the dbscan: block below.
    # This entry is a routing declaration only — do not add min_samples
    # or eps here, as they would conflict with the dedicated block.
    - name: dbscan

    # HDBSCAN: all detailed parameters live in the hdbscan: block below.
    # HDBSCAN always runs paired with DBSCAN for comparison.
    - name: hdbscan

evaluation:
  top_k_confusions: 20

visualization:
  method: umap                               # umap | tsne
  umap:
    n_neighbors: 30
    min_dist: 0.1
    metric: cosine
    random_state: 42
  tsne:
    perplexity: 40
    random_state: 42
  subsample: 5000
  dpi: 300
  export_pdf: true

output_dir: results/mothDK
seed: 42

# -------------------------------------------------------
# DBSCAN configuration
#
# These parameters are used exclusively by the DBSCANPipeline.
# Do NOT duplicate them in clustering.methods above — the
# dedicated block here always wins.
# -------------------------------------------------------

dbscan:
  # PCA components before DBSCAN. Do NOT use UMAP output here.
  # 100 dims retains ~94.8% of variance in BioCLIP-2 embeddings.
  pca_components: 100

  # min_samples: used for both the k-distance plot and DBSCAN itself.
  # Rule of thumb: ln(N) where N ~ 2200 images ~ 7.7; we use 5,
  # which is slightly conservative and allows smaller genuine clusters.
  # This produced eps=0.3471 and ARI=0.9233 on EU-Moth.
  min_samples: 5

  # eps_range: if omitted, auto-computed from the k-distance knee.
  # Uncomment and set manually to override:
  # eps_range: [0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60]

  # final_eps: override the auto-selected best eps after seeing the sweep.
  # Leave commented out to use the sweep result automatically.
  # final_eps: 0.3471

# -------------------------------------------------------
# HDBSCAN configuration
#
# These parameters are used exclusively by the HDBSCANPipeline.
# Do NOT duplicate them in clustering.methods above.
# -------------------------------------------------------

hdbscan:
  pca_components: 100

  # Sweep range for min_cluster_size.
  # For EU-Moth (~11 images/class): 3-15 is a sensible range.
  sweep_range: [2, 3, 5, 10, 15, 20, 25, 30, 35, 40, 50, 60, 70, 80, 90, 100, 110, 120, 130, 140, 150, 160, 170, 180]

  # final_min_cluster_size: override after seeing the sweep.
  # Leave commented to use the sweep result automatically.
  # final_min_cluster_size: 3

  # min_samples: HDBSCAN core point conservatism.
  # None = defaults to min_cluster_size (recommended).
  # min_samples: 5

# -------------------------------------------------------
# Config: MothSpeciesDK  —  BioCLIP (ViT-B/16)
# 351 Danish moth species, long-tailed distribution.
# -------------------------------------------------------

dataset:
  name: mothDK
  format: imagefolder
  root: D:\Thesis\Test 1st\MothSpeciesDK\MothSpeciesDK
  image_extensions: [jpg, jpeg, png]
  num_classes: 351

model:
  name: bioclip
  pretrained: hf-hub:imageomics/bioclip   # ViT-B/16
  normalize_embeddings: true
  batch_size: 64
  num_workers: 8

  prompt_templates:
    - "{name}"
    - "{name}, family {family}"
    - "{name}, family {family}, order {order}"
    - "a species of genus {genus}, family {family}"

clustering:
  methods:
    - name: kmeans
      n_clusters: 351
      n_init: 50
      random_state: 42
      max_iter: 500

    - name: agglomerative
      n_clusters: 351
      linkage: ward

    - name: spectral
      n_clusters: 351
      n_init: 10
      random_state: 42
      n_neighbors: 15

    - name: gmm
      n_clusters: 351
      covariance_type: diag    # 'full' is infeasible for 512-D embeddings
      random_state: 42
      max_iter: 300

    - name: dbscan

    - name: hdbscan

evaluation:
  top_k_confusions: 20

visualization:
  method: umap
  umap:
    n_neighbors: 30
    min_dist: 0.1
    metric: cosine
    random_state: 42
  subsample: 5000
  dpi: 300
  export_pdf: true

output_dir: results/mothDK_bioclip
seed: 42

# -------------------------------------------------------
# Dimensionality reduction (dual-path architecture)
# -------------------------------------------------------

reduction:
  partition:
    method: pca
    n_components: 50
  density:
    method: umap
    n_components: 100
    n_neighbors: 15
    min_dist: 0.1
    metric: cosine

dbscan:
  min_samples: 5

hdbscan:
  sweep_range: [2, 3, 5, 10, 15, 20, 25, 30, 35, 40, 50, 60, 70, 80, 90, 100, 110, 120, 130, 140, 150, 160, 170, 180]
  cluster_selection_method: eom

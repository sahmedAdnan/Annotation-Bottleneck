# -------------------------------------------------------
# Config: Unlabeled Specimen Identification Pipeline
#         SINGLE TAXONOMIC PROMPT variant
# -------------------------------------------------------
# Scenario: "I have unknown moth images from Europe.
#            Help me identify them."
#
# Difference from config_example.yaml:
#   This config uses ONE taxonomic prompt instead of a 5-template
#   ensemble. A standalone ablation (EU-Moth + MothDK, BioCLIP-2,
#   per-image zero-shot top-1 vs 200 candidates) found that the
#   5-template ensemble consistently REDUCED accuracy, while a single
#   prompt matching BioCLIP-2's training format (order -> family ->
#   genus -> species) matched the best single prompt at no cost.
#   Ensembling is unnecessary and counterproductive for BioCLIP-2.
#     EU-Moth : generic 0.977 | taxonomic 0.986 | ensemble 0.947
#     MothDK  : generic 0.778 | taxonomic 0.774 | ensemble 0.721
# -------------------------------------------------------

# Path to folder containing unknown images (flat directory, no subfolders needed)
images_dir: D:\Thesis\Test 1st\eu-moths-dataset-main\eu-moths-dataset-main\images

# GBIF query settings: what taxon, where
gbif:
  order_key: 797              # Single: 797 = Lepidoptera. Multi-taxa: [797, 7192]
                              # Common keys: 797=Lepidoptera, 7192=Aves, 1457=Coleoptera
  region: europe              # europe, asia, africa, north_america, south_america, oceania
  query_mode: balanced        # "balanced" = per-family coverage, "flat" = top-N globally
  per_family: 40              # common species per family (balanced mode)
  rare_per_family: 10         # rare tail species per family (balanced mode)
  n_candidates: 400           # only used in flat mode
  include_rare: true          # only used in flat mode
  images_per_species: 3       # reference image URLs per candidate (loaded from GBIF on-the-fly)

# BioCLIP-2 model settings
model:
  name: bioclip2
  pretrained: hf-hub:imageomics/bioclip-2.5-vith14
  normalize_embeddings: true
  batch_size: 64
  num_workers: 8

  # SINGLE taxonomic prompt (no ensemble).
  # Ranks go general -> specific, species ({name}) last, space-separated,
  # matching BioCLIP-2's training text format.
  # {name}, {genus}, {family}, {order} are filled from GBIF taxonomy.
  # If a rank is missing for a class, that placeholder is skipped and the
  # prompt falls back to the ranks that are present (never leaves a blank).
  prompt_templates:
    - "a photo of {order} {family} {genus} {name}"

# Clustering settings
# For unknown images, HDBSCAN is ideal (no need to guess n_clusters)
clustering:
  method: hdbscan
  params:
    min_cluster_size: 5       # minimum images to form a cluster
    # min_samples: defaults to min_cluster_size (HDBSCAN library default)

# -------------------------------------------------------
# Dimensionality Reduction
#
# One method is applied to ALL clustering algorithms.
# Run the unlabeled analysis script to find the best setting:
#   python cli/reduction_analysis_unlabeled.py --config <this_config>
#
# Supported methods:
#   none      -- no reduction; use full 768D embeddings
#   pca       -- PCA (linear, fast)
#   umap      -- UMAP (non-linear, topology-preserving)
#   pca+umap  -- two-stage: PCA first, then UMAP
# -------------------------------------------------------
reduction:
  method: umap          # none | pca | umap | pca+umap
  n_components: 20     # target dimension (ignored when method: none)
  n_neighbors: 15       # UMAP only: local vs. global structure balance
  min_dist: 0.1         # UMAP only: min distance in embedded space
  metric: cosine        # UMAP only: distance metric in original space
  # pca_components: 100 # pca+umap only: intermediate PCA dimension before UMAP

# Annotation uncertainty settings
annotation:
  uncertainty:
    review_threshold: 0.55    # flag for review if combined >= 0.55
    human_threshold: 0.70     # flag as human_required if combined >= 0.70
    weights:
      text_margin: 0.35
      membership_probability: 0.25
      cluster_agreement: 0.25
      taxonomic_consistency: 0.15

# Visualization
visualization:
  method: umap
  umap:
    n_neighbors: 15
    min_dist: 0.1
    metric: cosine
    random_state: 42
  dpi: 300
  export_pdf: false

output_dir: results/Annotation_eumoth_taxonomic/
seed: 42
